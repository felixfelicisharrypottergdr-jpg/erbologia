<div style="width:100%; max-width:1100px; margin:0 auto; overflow:visible;"> 
 <iframe 
 id="erbologiaFrame" 
 src="https://felixfelicisharrypottergdr-jpg.github.io/erbologia/" 
 style=" 
 display:block; 
 width:100%; 
 height:1600px; 
 border:0; 
 margin:0; 
 padding:0; 
 overflow:hidden; 
 background:#172116; 
 " 
 scrolling="no" 
 frameborder="0"> 
 </iframe> 
</div> 
 
<script type="text/javascript"> 
(function(){ 
 var ORIGIN = "https://felixfelicisharrypottergdr-jpg.github.io"; 
 var frame = document.getElementById("erbologiaFrame"); 
 if(!frame) return; 
 
 function applicaAltezza(valore){ 
 var h = Number(valore); 
 if(!isFinite(h) || h < 500 || h > 30000) return; 
 
 h = Math.ceil(h); 
 
 var attuale = parseInt(frame.style.height, 10) || 0; 
 if(Math.abs(attuale - h) < 4) return; 
 
 frame.style.height = h + "px"; 
 frame.setAttribute("height", String(h)); 
 } 
 
 window.addEventListener("message", function(event){ 
 if(event.origin !== ORIGIN) return; 
 if(event.source !== frame.contentWindow) return; 
 
 var data = event.data || {}; 
 
 if( 
 data.tipo !== "altezzaErbologia" && 
 data.type !== "ffgdr:iframe-height" 
 ) return; 
 
 applicaAltezza( 
 data.altezza != null ? data.altezza : data.height 
 ); 
 }); 
 
 function chiediAltezza(){ 
 try{ 
 frame.contentWindow.postMessage({ 
 type: "ffgdr:request-height", 
 tipo: "richiediAltezzaErbologia" 
 }, ORIGIN); 
 }catch(e){} 
 } 
 
 frame.addEventListener("load", function(){ 
 setTimeout(chiediAltezza, 50); 
 setTimeout(chiediAltezza, 350); 
 setTimeout(chiediAltezza, 900); 
 }); 
 
 setTimeout(chiediAltezza, 150); 
 setTimeout(chiediAltezza, 1000); 
})(); 
</script>
